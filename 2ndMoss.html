    <div class="question-container hidden" id="q5">
  <p>You finished the quiz!</p>
  <br>
  <p1>Fill Out This Form To Let Out Your Inner Moss Fairy!!</p1>
  <br>
    <iframe 
  src="https://form.jotform.com/262726260339055" 
  style="width:100%; border:none;" 
  height="600">
</iframe>

<script>
  function checkAnswer(currentId, nextId, correctAnswer) {
  const selected = document.querySelector(`input[name="${currentId}"]:checked`);
  const feedback = document.getElementById(`${currentId}-feedback`);

  if (!selected) {
    feedback.style.color = "orange";
    feedback.textContent = "Please select an answer.";
    return;
  }

  if (selected.value === correctAnswer) {
    feedback.style.color = "green";
    feedback.textContent = "Correct!";
    
    // Wait a brief moment before showing the next question
    setTimeout(() => {
      document.getElementById(currentId).classList.add("hidden");
      const nextQuestion = document.getElementById(nextId);
      if (nextQuestion) {
        nextQuestion.classList.remove("hidden");
      }
    }, 800);
  } else {
    feedback.style.color = "red";
    feedback.textContent = "Incorrect. Try again!";
  }
}

</script>
